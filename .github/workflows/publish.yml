name: Publish crates

on:
  workflow_dispatch:
    inputs:
      release_action:
        description: Choose publish to upload immutable crate versions to crates.io
        required: true
        type: choice
        default: verify-only
        options:
          - verify-only
          - publish

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
      - name: Test release tooling and publication order
        run: |
          python3 scripts/test_release_scripts.py
          python3 scripts/publish-workspace.py
      - name: Bootstrap-preflight every publishable source archive
        run: python3 scripts/verify-packages.py

  publish:
    name: Publish to crates.io
    needs: verify
    if: inputs.release_action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: crates-io
      url: https://crates.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
      - name: Publish workspace in stable dependency order
        run: python3 scripts/publish-workspace.py --execute
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

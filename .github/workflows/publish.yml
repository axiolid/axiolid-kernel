name: Publish crates

on:
  workflow_dispatch:
    inputs:
      release_action:
        description: Choose publish to upload immutable crate versions to crates.io
        required: true
        type: choice
        default: verify-only
        options:
          - verify-only
          - publish

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify every crate can be packaged
        run: cargo package --workspace --locked

  publish:
    name: Publish to crates.io
    needs: verify
    if: inputs.release_action == 'publish'
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish workspace
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

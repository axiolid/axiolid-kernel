name: Issue triage

# Templates set type, assignee, and labels for issues opened through them.
# This backstops the cases templates cannot reach: issues opened via API, via
# `gh issue create`, transferred from another repo, or converted from a
# discussion. It never overrides an explicit maintainer choice.

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Classify issues created from a discussion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
          BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          # "Create issue from discussion" copies the discussion body and
          # prepends a marker line. It does NOT go through an issue template,
          # so type/labels/assignee are all empty. The discussion's category is
          # the only signal for what kind of work this is -- use it.
          #
          # Marker format (verified against real converted issues):
          #   ### Discussed in https://github.com/OWNER/REPO/discussions/N
          dnum=$(printf '%s' "$BODY" \
            | grep -oE 'Discussed in https://github\.com/[^/]+/[^/]+/discussions/[0-9]+' \
            | grep -oE '[0-9]+$' | head -1 || true)

          if [ -z "$dnum" ]; then
            echo "not converted from a discussion"
            exit 0
          fi

          owner="${REPO%%/*}"; name="${REPO##*/}"
          cat=$(gh api graphql -f query='
            query($o:String!,$n:String!,$d:Int!){
              repository(owner:$o,name:$n){
                discussion(number:$d){ category{ name } }
              }
            }' -f o="$owner" -f n="$name" -F d="$dnum" \
            --jq '.data.repository.discussion.category.name')
          echo "discussion #$dnum is in category: $cat"

          # A discussion category maps to exactly one kind of work. Features ask
          # for behavior that does not exist; Optimization asks for the same
          # behavior, cheaper. Those are different types, not one bucket.
          case "$cat" in
            Features)     want=Feature ;;
            Optimization) want=Optimization ;;
            Questions)    want=Task ;;
            *)            want=Task ;;
          esac

          cur=$(gh api "repos/$REPO/issues/$NUM" --jq '.type.name // empty')
          if [ -n "$cur" ]; then
            echo "type already set ($cur); leaving it alone"
          elif gh api -X PATCH "repos/$REPO/issues/$NUM" -f "type=$want" >/dev/null 2>&1; then
            echo "set type=$want from category $cat"
          else
            # The org may not define this type yet. Degrade to Task and keep the
            # distinction in a label so nothing is silently lost.
            gh api -X PATCH "repos/$REPO/issues/$NUM" -f type=Task >/dev/null
            gh issue edit "$NUM" --repo "$REPO" --add-label optimization || true
            echo "type '$want' unavailable; used Task + optimization label"
          fi

      - name: Ensure type, assignee, and triage label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          issue=$(gh api "repos/$REPO/issues/$NUM")
          type=$(echo "$issue" | jq -r '.type.name // empty')
          assignees=$(echo "$issue" | jq -r '.assignees | length')
          labels=$(echo "$issue" | jq -r '[.labels[].name] | join(" ")')

          # 1. Every issue carries a type. Infer a conservative default only
          #    when one is absent -- never reclassify a deliberate choice.
          if [ -z "$type" ]; then
            case "$labels" in
              *papercut*)      inferred=Bug ;;
              *capability*)    inferred=Feature ;;
              *)               inferred=Task ;;
            esac
            gh api -X PATCH "repos/$REPO/issues/$NUM" -f "type=$inferred" >/dev/null
            echo "set type=$inferred (was empty)"
          else
            echo "type already set: $type"
          fi

          # 2. Every issue has an owner, so nothing sits unowned.
          if [ "$assignees" = "0" ]; then
            gh issue edit "$NUM" --repo "$REPO" --add-assignee GeneralPawz
            echo "assigned GeneralPawz"
          fi

          # 3. Triage state lives on the project board, not in labels. The one
          #    thing the board cannot express is "nobody has looked at this yet",
          #    because an untriaged issue is not on the board at all.
          case "$labels" in
            *needs-triage*) echo "already flagged" ;;
            *) gh issue edit "$NUM" --repo "$REPO" --add-label needs-triage
               echo "flagged needs-triage" ;;
          esac

      - name: Warn when type and labels disagree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          issue=$(gh api "repos/$REPO/issues/$NUM")
          type=$(echo "$issue" | jq -r '.type.name // empty')
          labels=$(echo "$issue" | jq -r '[.labels[].name] | join(" ")')

          # A papercut is a defect in ergonomics, so it must be typed Bug.
          # Catching this early keeps the type field trustworthy for filtering.
          case "$labels:$type" in
            *papercut*:Feature)
              gh issue comment "$NUM" --repo "$REPO" --body \
                "🤖 This is labelled \`papercut\` but typed **Feature**. A papercut is friction in behavior that already exists, so it should be typed **Bug**. If the kernel genuinely cannot do this yet, it belongs in [🚀 Features](https://github.com/axiolid/kernel/discussions/new?category=features) instead."
              ;;
            *) echo "type/label consistent" ;;
          esac

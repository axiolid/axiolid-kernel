name: Roadmap freshness

# The roadmap explains ordering and reasoning; the project board carries status.
# This gate stops the roadmap drifting back into a status page that goes stale.

on:
  push:
    branches: [main]
    paths:
      - "docs/ROADMAP.md"
      - "scripts/check-roadmap-freshness.py"
      - ".github/workflows/roadmap.yml"
  pull_request:
    paths:
      - "docs/ROADMAP.md"
      - "scripts/check-roadmap-freshness.py"
      - ".github/workflows/roadmap.yml"
  # Milestones change outside of any commit, so re-check on a schedule too.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check roadmap does not duplicate live state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-roadmap-freshness.py

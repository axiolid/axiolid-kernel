name: Papercut / ergonomics
description: >
  Existing behavior is correct but awkward to use — naming, visibility, a
  missing helper, a clumsy signature. One small fix, no design debate needed.
labels: ["papercut"]
body:
  - type: markdown
    attributes:
      value: |
        ### Is this the right place?

        A **papercut** is an *issue* — the fix is small, obvious, and needs no
        design agreement. Something already works; using it is just annoying.

        Pick a different route if:

        - You want the kernel to **do something it cannot do today** →
          [request functionality](https://github.com/axiolid/kernel/discussions/new?category=features)
          (discussion — needs scope and design agreement first)
        - You want existing behavior to be **faster or lighter** →
          [suggest an optimization](https://github.com/axiolid/kernel/discussions/new?category=optimization)
          (discussion — needs a measurement, and trades off against other work)
        - Something is **wrong or crashes** → use the bug report template

        Rule of thumb: a papercut costs you *keystrokes*. An optimization costs
        you *milliseconds*. A feature request costs you *capability you don't have*.

  - type: textarea
    id: friction
    attributes:
      label: What's awkward
      description: What did you have to work around, and how? Paste the clumsy call site.
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: Concrete rename, helper, or visibility change, if you have one in mind.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - exact-brep
        - intersection
        - nurbs
        - mesh
        - architecture
        - release
        - not sure
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: >
        Papercuts are almost always `small`. Flag `big` only if fixing it
        cascades into a public API change — that likely needs a discussion first.
      options:
        - small
        - big
    validations:
      required: true

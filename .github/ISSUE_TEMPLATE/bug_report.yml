name: Bug report
description: Something behaves incorrectly, or doesn't compile/build as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Correctness problems are issues. If instead you want a *new* capability,
        or want existing behavior to be *faster*, start a discussion:
        [functionality](https://github.com/axiolid/kernel/discussions/new?category=features) ·
        [optimization](https://github.com/axiolid/kernel/discussions/new?category=optimization)

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences. What's broken?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >
        Minimal repro (code, IFC/STEP/XML snippet, command), and the exact
        commit/version/HEAD you tested against. Claims without evidence get
        bounced back.
      placeholder: |
        Repo @ commit <sha>
        cargo test / command run:
        Actual output:
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What should have happened instead?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - exact-brep
        - intersection
        - nurbs
        - mesh
        - architecture
        - release
        - not sure
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: >
        `small` = self-contained fix, one file/module, no public API break.
        `big` = touches the public API, spans crates, or needs a design decision.
      options:
        - small
        - big
    validations:
      required: true

[workspace]
resolver = "2"
members = [
    "crates/foundation/core",
    "crates/representations/analytic/curve",
    "crates/representations/analytic/surface",
    "crates/representations/analytic/primitive",
    "crates/representations/region/profile",
    "crates/representations/topology",
    "crates/representations/brep",
    "crates/representations/discrete/mesh",
    "crates/representations/modeling/graph",
    "crates/contracts/operations/tessellate",
    "crates/contracts/common",
    "crates/algorithms/reference",
    "crates/algorithms/parametric/nurbs",
    "crates/algorithms/construction/construct",
    "crates/algorithms/planar/overlay",
    "crates/algorithms/query/spatial",
    "crates/algorithms/query/measure",
    "crates/algorithms/sampled/field",
    "crates/algorithms/repair/heal",
    "crates/providers/mesh/boolmesh",
    "crates/execution/compile",
    "crates/execution/cpu",
    "crates/execution/gpu",
    "crates/facade/axiolid",
    "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MPL-2.0"
authors = ["point-grey"]
repository = "https://github.com/axiolid/axiolid-kernel"
homepage = "https://axiolid.github.io/axiolid-kernel/"
readme = "README.md"

[workspace.dependencies]
# Format-agnostic Axiolid geometry kernel. Leaf crates remain independently consumable.
axiolid = { path = "crates/facade/axiolid", version = "0.1.0", default-features = false }
axiolid-core = { path = "crates/foundation/core", version = "0.1.0" }
axiolid-mesh = { path = "crates/representations/discrete/mesh", version = "0.1.0" }
axiolid-model = { path = "crates/representations/modeling/graph", version = "0.1.0" }
axiolid-primitive = { path = "crates/representations/analytic/primitive", version = "0.1.0" }
axiolid-heal = { path = "crates/algorithms/repair/heal", version = "0.1.0" }
axiolid-nurbs = { path = "crates/algorithms/parametric/nurbs", version = "0.1.0" }
axiolid-construct = { path = "crates/algorithms/construction/construct", version = "0.1.0" }
axiolid-profile = { path = "crates/representations/region/profile", version = "0.1.0" }
axiolid-curve = { path = "crates/representations/analytic/curve", version = "0.1.0" }
axiolid-surface = { path = "crates/representations/analytic/surface", version = "0.1.0" }
axiolid-topology = { path = "crates/representations/topology", version = "0.1.0" }
axiolid-brep = { path = "crates/representations/brep", version = "0.1.0" }
axiolid-tessellate = { path = "crates/contracts/operations/tessellate", version = "0.1.0" }
axiolid-spatial = { path = "crates/algorithms/query/spatial", version = "0.1.0" }
axiolid-measure = { path = "crates/algorithms/query/measure", version = "0.1.0" }
axiolid-overlay = { path = "crates/algorithms/planar/overlay", version = "0.1.0" }
axiolid-field = { path = "crates/algorithms/sampled/field", version = "0.1.0", default-features = false }
i_overlay = "4.5.2"
axiolid-reference = { path = "crates/algorithms/reference", version = "0.1.0" }
axiolid-compile = { path = "crates/execution/compile", version = "0.1.0" }
axiolid-kernel = { path = "crates/contracts/common", version = "0.1.0", default-features = false }
axiolid-backend-cpu = { path = "crates/execution/cpu", version = "0.1.0", default-features = false }
axiolid-backend-gpu = { path = "crates/execution/gpu", version = "0.1.0", default-features = false }
axiolid-mesh-boolean-boolmesh = { path = "crates/providers/mesh/boolmesh", version = "0.1.0" }
glam = "0.29"
thiserror = "2.0"
rayon = "1.10"
smallvec = "1.13"
ahash = "0.8"
memmap2 = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }
cargo_metadata = "0.19"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.bench]
lto = "thin"
codegen-units = 1
debug = true

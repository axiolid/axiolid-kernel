[package]
name = "axiolid-boolmesh"
description = "boolmesh-backed MeshBoolean provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[dependencies]
axiolid-core.workspace = true
axiolid-mesh.workspace = true
axiolid-kernel = { workspace = true, features = ["mesh-boolean"] }
boolmesh = "0.1.9"

[[bench]]
name = "subtract_many"
harness = false

[dev-dependencies]
# The scalar oracle, used only for differential testing (ADR 0012). A
# dev-dependency deliberately: the production provider must never depend on the
# reference implementation at runtime.
axiolid-scalar.workspace = true

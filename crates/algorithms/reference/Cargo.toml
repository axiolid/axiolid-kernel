[package]
name = "axiolid-scalar"
description = "Portable scalar reference implementation and certified predicates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[dependencies]
axiolid-core.workspace = true
axiolid-kernel = { workspace = true, features = ["mesh-boolean", "mesh-section"] }
axiolid-curve.workspace = true
axiolid-measure.workspace = true
axiolid-mesh.workspace = true
axiolid-primitive.workspace = true
axiolid-surface.workspace = true
axiolid-spatial.workspace = true

[[bench]]
name = "clash"
harness = false

[[bench]]
name = "predicates"
# No criterion: the harness reports throughput and escalation together,
# which is the pairing that makes either number interpretable.
harness = false

[package.metadata.axiolid]
architecture-version = 1
layer = "algorithms"
role = "algorithm.reference"
domain = "reference"
public = true
format-neutral = true
allowed-internal-dependencies = ["axiolid-core", "axiolid-curve", "axiolid-kernel", "axiolid-measure", "axiolid-mesh", "axiolid-primitive", "axiolid-spatial", "axiolid-surface"]
